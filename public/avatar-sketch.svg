<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f3ec" />
      <stop offset="100%" stop-color="#d3e6db" />
    </linearGradient>
    <linearGradient id="sketchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062217" />
      <stop offset="100%" stop-color="#1d382b" />
    </linearGradient>
  </defs>
  <!-- Background with subtle texture -->
  <rect width="200" height="200" rx="32" fill="url(#bgGrad)" />
  
  <!-- Sketch lines for person profile / silhouette -->
  <g fill="none" stroke="url(#sketchGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hair / Head Contour -->
    <path d="M72 82 C68 55 85 36 102 36 C124 36 138 52 136 78 C135 88 132 96 128 102" />
    <path d="M80 50 C95 44 116 45 125 54" stroke-width="3.5" opacity="0.75" />
    
    <!-- Face Profile Line -->
    <path d="M102 36 C92 48 90 64 90 74 C90 84 96 90 102 96 C108 102 116 102 122 96" />
    <!-- Eyebrow & Eye Sketch -->
    <path d="M96 68 Q103 66 109 69" stroke-width="3" />
    <path d="M98 74 Q103 76 107 74" stroke-width="2.5" />
    <circle cx="102.5" cy="73" r="2" fill="#062217" stroke="none" />
    <!-- Nose & Lips subtle sketch -->
    <path d="M108 76 L112 83 L106 85" stroke-width="2.5" />
    <path d="M103 91 Q108 93 113 90" stroke-width="2.5" />
    
    <!-- Neck & Collar -->
    <path d="M92 100 C92 112 90 120 86 128" />
    <path d="M116 98 C116 110 122 120 128 126" />
    
    <!-- Shoulders / Clothes Sketch -->
    <path d="M52 168 C56 142 74 132 86 128 C98 125 114 125 128 126 C142 130 156 140 160 168" />
    <path d="M86 128 C94 140 112 140 128 126" stroke-width="3.5" />
    
    <!-- Stylized artistic accent lines -->
    <path d="M58 178 L154 178" stroke-width="3" opacity="0.4" stroke-dasharray="6 6" />
  </g>
  
  <!-- Subtle accent dot -->
  <circle cx="152" cy="48" r="4" fill="#526600" opacity="0.6" />
  <circle cx="162" cy="60" r="2.5" fill="#d0ef68" />
</svg>
